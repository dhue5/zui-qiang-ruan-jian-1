name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-and-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release -- --test-threads=1
      - run: npm run build
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: 最强软件2-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
